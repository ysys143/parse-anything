[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parse-anything"
version = "0.1.0"
description = "Deterministic-first, ontology-driven PDF parsing into agent-ready layered artifacts + RAG chunks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pypdfium2>=4",            # license-clean (BSD/Apache) PDF render + text/bbox/value layer -- §3.1, F17
    "pdf-inspector>=0.2",      # triage classify (text/scanned) -- §3.4 (diagnosis signal, not authority -- F16)
    "Pillow>=10",              # image ops: rotate/deskew/crop/encode
    "numpy>=1.24",             # input-quality gate (laplacian variance) -- quality.py, F14
    "opendataloader-pdf>=2.4", # ODL structure + clean-text layer (REQUIRES Java 17) -- F17, processing-tiers §2.6
]

[project.scripts]
parse-anything = "parse_anything.cli:main"
pa = "parse_anything.cli:main"        # short alias

[project.optional-dependencies]
dev = ["pytest>=8", "reportlab>=4"]   # reportlab: generate tiny PDFs for tests (no committed binaries)
# Mode 2 (our KG output) seam -- design doc §10. Heavy extractor/graph deps live behind this
# extra so the lean parsing core (`pip install parse-anything`) never pulls them. Populated when the
# Extractor port lands (LangChain LLMGraphTransformer / GraphRAG / graph store drivers).
kg = []

[tool.hatch.build.targets.wheel]
packages = ["src/parse_anything"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = ["-p", "no:html"]

[tool.ruff]
# worktree-b / worktree-c are auxiliary git worktrees checked out inside the repo, not this tree's source.
extend-exclude = ["worktree-*"]

[tool.pyright]
# Resolve first-party (src/parse_anything) + third-party imports (pypdfium2/PIL/... declared in
# dependencies) against the uv-managed virtualenv, so the type checker doesn't report phantom
# "could not be resolved" errors.
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
